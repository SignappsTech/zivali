# Local stand-in for Cloudflare R2 (ADR-014, C5): MinIO with the three buckets. Local credentials only.
#   docker compose -f docker-compose.dev.yml up -d     (also run by `pnpm bootstrap`)
# S3 API http://127.0.0.1:9000, console http://127.0.0.1:9001 (user zivali, password zivali-local-only).
# Images: MinIO no longer publishes community images on Docker Hub or Quay, so these are Chainguard's
# source builds of MinIO (free tier: `latest` tags only).
name: zivali-dev

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: zivali
      MINIO_ROOT_PASSWORD: zivali-local-only
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: creates the buckets (idempotent) and makes the media bucket publicly readable, like R2.
  minio-buckets:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until mc alias set local http://minio:9000 zivali zivali-local-only >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/zivali-private local/zivali-media local/zivali-backups
        mc anonymous set download local/zivali-media
    restart: 'no'

volumes:
  minio-data:
