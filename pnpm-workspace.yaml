packages:
  - apps/*
  - packages/*

# Expo/Metro needs a flat node_modules (ADR-001). pnpm 11 reads this here; .npmrc keeps it for other tools.
nodeLinker: hoisted

# Install scripts run only when listed here (true) or are skipped on purpose (false).
allowBuilds:
  # eslint-plugin-import-x resolver: its postinstall only re-checks the native binding that pnpm already
  # installs from optionalDependencies, so it is skipped.
  unrs-resolver: false
  # next-intl (web) pulls these in for its message extractor, which we do not use; the prebuilt bindings come from
  # optionalDependencies, so their build-from-source and binding-check scripts are skipped.
  '@parcel/watcher': false
  '@swc/core': false
  # tsx, tsup and vitest (apps/api): esbuild's binary comes from the @esbuild/<platform> optional dependency, so its
  # postinstall check is skipped.
  esbuild: false
  # Prisma CLI (apps/api): its preinstall only checks the Node version; engines are fetched on first use.
  prisma: false
  # @prisma/engines (apps/api): its postinstall pre-downloads the engines; prisma generate and migrate fetch them on
  # first use, so the script is skipped (without this entry pnpm 11 exits with ERR_PNPM_IGNORED_BUILDS).
  '@prisma/engines': false

# temporary: exact versions younger than minimumReleaseAge (published 2026-10-14); remove after 2026-10-15 17:00 UTC.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-router@57.0.27
  - expo@57.0.29
