packages:
  - apps/*
  - packages/*

# Expo/Metro needs a flat node_modules (ADR-001). pnpm 11 reads this here; .npmrc keeps it for other tools.
nodeLinker: hoisted

# Install scripts run only when listed here (true) or are skipped on purpose (false).
allowBuilds:
  # eslint-plugin-import-x resolver: its postinstall only re-checks the native binding that pnpm already
  # installs from optionalDependencies, so it is skipped.
  unrs-resolver: false
  # next-intl (web) pulls these in for its message extractor, which we do not use; the prebuilt bindings come from
  # optionalDependencies, so their build-from-source and binding-check scripts are skipped.
  '@parcel/watcher': false
  '@swc/core': false
  # tsx, tsup and vitest (apps/api): esbuild's binary comes from the @esbuild/<platform> optional dependency, so its
  # postinstall check is skipped.
  esbuild: false
  # Prisma CLI (apps/api): its preinstall only checks the Node version; engines are fetched on first use.
  prisma: false
  # @prisma/engines (apps/api): its postinstall pre-downloads the engines; prisma generate and migrate fetch them on
  # first use, so the script is skipped (without this entry pnpm 11 exits with ERR_PNPM_IGNORED_BUILDS).
  '@prisma/engines': false
  # swagger-ui-dist (apps/api /docs, TASK-3.12): its postinstall is Scarf install telemetry, so it never runs.
  '@scarf/scarf': false
  # @react-native-firebase (mobile analytics, TASK-7.3): @firebase/util's postinstall writes web SDK defaults and
  # protobufjs's only checks its version scheme; neither is needed for the native SDK.
  '@firebase/util': false
  protobufjs: false

# Fixed versions forced over the pinned or too-narrow ranges of tooling parents (tmp via @lhci/cli > inquirer >
# external-editor, mysql2 via the prisma CLI).
overrides:
  tmp: ^0.2.6
  mysql2: ^3.22.0

# `pnpm audit --audit-level high` (CI) skips these advisories, accepted 2026-10-15 (docs/05 §Security). Each has no
# fix or its fix is a major bump outside the parent's declared range, and none is reachable with untrusted input.
# Review each entry by 2026-12-15: drop an entry once its fix lands.
auditConfig:
  ignoreGhsas:
    # extract-zip symlink traversal (no fix): lighthouse > puppeteer-core browser download; Lighthouse uses
    # Playwright's Chromium (CHROME_PATH), so nothing is downloaded or unzipped.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # basic-ftp <6.2.1 ReDoS in Client.list(): lighthouse > puppeteer proxy-agent (basic-ftp ^5); no FTP is used.
    - GHSA-c475-qrg2-pj4r
    # deepmerge-ts <8 stack exhaustion: prisma > @prisma/config (pinned 7.1.5). prisma is an apps/api runtime
    # dependency, so it ships in the api image; not exploitable, it only merges our static prisma.config.ts.
    - GHSA-ggr8-5vv4-36mx
    # node-forge PKCS#1 v1.5 signature check (no fix): expo > @expo/cli code signing, which we do not use.
    - GHSA-86w9-cpqp-85rv
    # braces stack exhaustion (no fix): metro > micromatch; Metro's globs come from our own config.
    - GHSA-vfj7-8cjw-p6xm

# temporary: exact versions younger than minimumReleaseAge (published 2026-10-14); remove after 2026-10-15 17:00 UTC.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/metro-runtime@57.0.17'
  - '@expo/prebuild-config@57.0.19'
  - '@expo/ui@57.0.24'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-linking@57.0.13
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo-router@57.0.27
  - expo@57.0.29
