# Included in every proxied location of templates/zivali.conf.template.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr is the real client (CF-Connecting-IP, trusted only from Cloudflare's ranges). The API trusts exactly
# one proxy hop (app.set('trust proxy', 1)), so req.ip is this value; anything a client sent is replaced.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_hide_header X-Powered-By;

add_header Strict-Transport-Security $zivali_hsts always;
add_header X-Content-Type-Options $zivali_nosniff always;
add_header Referrer-Policy $zivali_referrer always;
add_header X-Frame-Options $zivali_frame always;
