# CI (ADR-016, docs/04 §CI/CD): every pull request and every push to main runs the gates of `pnpm verify`, the
# quality kit and the Docker image builds. Branch protection on main requires the jobs verify, quality and images.
# The mobile app's gates run in mobile.yml instead: the app ships through EAS, so they do not hold up the web deploy
# (deploy.yml waits for this workflow only).
# No secrets are used: every adapter runs on its mock and the database is a throwaway local Supabase stack.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Local Supabase ports (supabase/README.md); the CLI reads these overrides of supabase/config.toml.
  SUPABASE_API_PORT: 54321
  SUPABASE_DB_PORT: 54322
  # pnpm quality serves the production web build here (scripts/quality.mjs).
  QUALITY_PORT: 8080
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    # `pnpm verify` without the mobile app (format, lint, root script tests, secretlint, then Turbo: lint, typecheck,
    # Vitest unit tests, i18n check, tokens build (contrast), API and ADR-021 security tests, web build), then
    # `pnpm audit --audit-level high` and the Playwright smoke as separate steps.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Start Supabase (Postgres with PostGIS and pgvector, Auth, Realtime)
        # stdout (URLs and the local demo keys) is dropped; errors still reach the log.
        run: |
          pnpm exec supabase start -x studio,postgres-meta,imgproxy > /dev/null
          url="postgresql://postgres:postgres@127.0.0.1:${SUPABASE_DB_PORT}/postgres?schema=app"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$url" >> "$GITHUB_ENV"
      - name: Migrate and seed (prisma migrate reset)
        run: pnpm db:reset
      - run: pnpm verify:static
      - run: pnpm exec turbo run lint typecheck test build --filter='!mobile'
      - run: pnpm audit --audit-level high
      - run: pnpm --filter web e2e
      - name: Trim the Turbo cache to the last 7 days
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  quality:
    # Quality kit on the production web build: axe, console errors, consent and ad guards, visual, Lighthouse CI,
    # links (TASK-4.1, docs/05 §Quality gates).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Temporarily non-blocking: the Lighthouse performance and script budgets on public pages fail until TASK-90.4
    # lands, and staging deploys wait for the whole ci workflow. The job still runs and uploads its report;
    # TASK-90.4 AC#4 makes it blocking again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Once public pages read the API on the server, start it here before the kit runs:
      #   pnpm exec supabase start -x studio,postgres-meta,imgproxy > /dev/null && pnpm db:reset
      #   pnpm --filter api build && (node apps/api/dist/server.js &) with DATABASE_URL as in the verify job
      - run: pnpm quality
      - name: Upload the quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: quality-report/
          retention-days: 14
      - name: Trim the Turbo cache to the last 7 days
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  images:
    # Docker builds of the api image (also the worker) and the web image, for the runner's platform (amd64); the
    # deploy builds the same Dockerfiles for linux/arm64.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm images

  # Deploys live in deploy.yml: staging after this workflow passes on main, production on version tags with manual
  # approval (ADR-016, TASK-5.1).
