# CI (ADR-016, docs/04 §CI/CD). Kept short so a push to main is live on staging in about 12-15 minutes (TASK-4.6,
# owner 2026-10-19): this workflow, then deploy.yml.
# Why lint, typecheck and the unit and API tests are not here: the full `pnpm verify` (verify:static, then Turbo lint,
# typecheck, Vitest and jest-expo, the API and ADR-021 security tests against the local database, every build) runs
# on each branch before it is reported done and again in merge.mjs, locally, before every merge to main; repeating it
# here was most of this job's minutes. The job keeps what the local merge gate does not run, or what must also hold on
# a clean runner: `pnpm verify:static` (format, root lint and script tests, secretlint), the web build, `pnpm audit`
# and the web e2e. Branch protection requires the check `verify` only.
# The other workflows: quality.yml (quality kit and Lighthouse, nightly and on demand), images.yml (Docker builds, only
# when Docker-relevant files change), mobile.yml (the app; it ships through EAS) and deploy.yml (staging after this
# workflow succeeds on a push to main; a cancelled, failed or skipped run deploys nothing).
# No secrets and no database: the e2e builds the web app against the C18 mock API (apps/web/e2e/mock-api.ts).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # A push that only touches docs, the backlog or Markdown starts nothing here, so it does not deploy either; its
    # secret scan is secrets.yml, which has no paths filter (TASK-4.10). Later
    # patterns win: two files under docs/ are build or test inputs and still count (the design tokens source of
    # packages/tokens, the photo fixture of apps/web/e2e/photos.spec.ts). Pull requests always run (required check).
    paths:
      - '**'
      - '!docs/**'
      - '!backlog/**'
      - '!**/*.md'
      - docs/design/tokens.json
      - docs/design/directions/img/dog-aussie.jpg

permissions:
  contents: read

concurrency:
  # A newer push to main (or a newer commit on a pull request) cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    # `pnpm verify:static`, the workspace packages the web app builds on (the tokens build with its contrast lint among
    # them), `pnpm audit --audit-level high`, then the Playwright e2e, whose web server runs the web build.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm verify:static
      # Only web's dependencies (`web^...`): the e2e's web server runs `pnpm build` (next build) itself, once.
      - run: pnpm exec turbo run build --filter='web^...'
      - run: pnpm audit --audit-level high
      # 4 workers for the runner's 4 vCPUs (Playwright's default is half the cores); retries stay as configured.
      - run: pnpm --filter web e2e --workers=4
      - name: Trim the Turbo cache to the last 7 days
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
