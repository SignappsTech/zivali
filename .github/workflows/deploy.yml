# Deploy (ADR-016, TASK-5.1): staging after CI passes on main, production on version tags (vX.Y.Z) after a reviewer
# approves the `production` environment. Both run scripts/deploy.mjs --deploy, the same steps as a workstation deploy:
# build the linux/arm64 images (Hetzner CAX11) on the runner and stream them to the VPS over SSH (docker save | zstd |
# docker load; no registry), one-off `prisma migrate deploy` and the seed (reference data), up and healthy, smoke checks
# (/ping, /v1/health/ready, the web's version, web home, ADR-021 exposure), else back to the running release.
# Off until the repository variable DEPLOY_ENABLED is 'true'. Secrets per GitHub environment (staging, production):
# README "Environments and credentials". Missing ones fail the job with NEEDS-INPUT and their names (--strict).
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  # One deploy per environment at a time; a running deploy is never cancelled halfway.
  group: deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  staging:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: staging
      url: https://${{ vars.WEB_HOST }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      # The api image's runtime stage (apt-get, Prisma engine) runs as linux/arm64; the JS builds run natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # BuildKit layer cache in the Actions cache (TASK-4.6): a docker-container builder (the docker driver cannot
      # export a cache), and the runtime token and cache URLs, which Actions hands to actions only, for the run steps;
      # deploy.mjs then passes --cache-from/--cache-to type=gha per image (cacheArgs).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose the Actions cache to docker buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_SERVICE_V2'])
              if (process.env[name]) core.exportVariable(name, process.env[name]);
      # deploy.mjs needs @aws-sdk/client-s3 (bucket checks) from apps/api.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter api...
      - run: node scripts/deploy.mjs staging --deploy --strict
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_FIREWALL_ID: ${{ vars.HETZNER_FIREWALL_ID }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          API_HOST: ${{ vars.API_HOST }}
          CERTBOT_CLOUDFLARE_TOKEN: ${{ secrets.CERTBOT_CLOUDFLARE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_GOOGLE_SIGN_IN }}
          NEXT_PUBLIC_APPLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_APPLE_SIGN_IN }}
      # Port 22 back to admin-only even when the deploy failed, was cancelled or never reached its own cleanup.
      - if: always()
        run: node scripts/deploy.mjs staging --close-ssh
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_FIREWALL_ID: ${{ vars.HETZNER_FIREWALL_ID }}

  production:
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Required reviewers on this environment are the manual approval (README "Environments and credentials").
    environment:
      name: production
      url: https://${{ vars.WEB_HOST }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags for `git describe` (deploy.mjs takes the version from the tag at HEAD).
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # BuildKit layer cache, as in the staging job.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose the Actions cache to docker buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_SERVICE_V2'])
              if (process.env[name]) core.exportVariable(name, process.env[name]);
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter api...
      - run: node scripts/deploy.mjs production --deploy --strict
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_FIREWALL_ID: ${{ vars.HETZNER_FIREWALL_ID }}
          WEB_HOST: ${{ vars.WEB_HOST }}
          API_HOST: ${{ vars.API_HOST }}
          CERTBOT_CLOUDFLARE_TOKEN: ${{ secrets.CERTBOT_CLOUDFLARE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.NEXT_PUBLIC_ANALYTICS_PROVIDER }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GOOGLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_GOOGLE_SIGN_IN }}
          NEXT_PUBLIC_APPLE_SIGN_IN: ${{ vars.NEXT_PUBLIC_APPLE_SIGN_IN }}
      # Port 22 back to admin-only even when the deploy failed, was cancelled or never reached its own cleanup.
      - if: always()
        run: node scripts/deploy.mjs production --close-ssh
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_FIREWALL_ID: ${{ vars.HETZNER_FIREWALL_ID }}
