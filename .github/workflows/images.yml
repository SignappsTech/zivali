# Docker builds of the api image (also the worker) and the web image, for the runner's platform (amd64). Only when a
# file that shapes the images changes (TASK-4.6): the Dockerfiles and their .dockerignore
# files, deploy/, the lockfile and pnpm config, any package.json, the deploy script and this workflow. The deploy
# (scripts/deploy.mjs) builds the same Dockerfiles for linux/arm64 itself, so a broken image also stops a deploy before
# anything is switched. Not a required check.
name: images

on:
  pull_request:
    paths:
      - '**/Dockerfile*'
      - deploy/**
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - scripts/deploy.mjs
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - '**/Dockerfile*'
      - deploy/**
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - scripts/deploy.mjs
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm images
