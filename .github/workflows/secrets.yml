# Secret scan (TASK-4.10, docs/05 §Security): secretlint over the whole tree on every pull request and every push to
# main, with no paths filter, so a token committed only in docs/, backlog/ or a Markdown file is caught too (ci.yml
# skips those pushes). The same scan as in `pnpm verify:static`: .secretlintrc.json, .secretlintignore and .gitignore.
# No pnpm install: npx fetches only secretlint and its rule preset, pinned to the pnpm-lock.yaml versions (bump them
# with the root devDependencies). Not a deploy gate: deploy.yml waits for ci.yml only.
name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, secretlint 13 needs Node 22
        with:
          node-version-file: package.json
      # Found values are masked in the log (secretlint's default).
      - run: >-
          npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7
          secretlint "**/*"
