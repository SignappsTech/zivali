# Mobile app gates (docs/04 §CI/CD): lint, typecheck, jest-expo unit tests and the `expo export` build of apps/mobile,
# with the shared packages it depends on. Separate from ci.yml so that the web deploy (deploy.yml, which waits for ci
# only) does not wait for the app, which ships through EAS. Runs when the app or anything it builds on changes.
name: mobile

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - eslint.config.mjs
      - .github/workflows/mobile.yml
      # The tokens source of packages/tokens. Markdown-only changes start nothing (a later pattern wins).
      - docs/design/tokens.json
      - '!**/*.md'
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.base.json
      - eslint.config.mjs
      - .github/workflows/mobile.yml
      - docs/design/tokens.json
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  # A newer push to main (or a newer commit on a pull request) cancels the older run.
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run lint typecheck test build --filter=mobile
      - name: Trim the Turbo cache to the last 7 days
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
